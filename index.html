<title>재원부 대표전화 (7141 당직)</title>
<style>
 :root { --navy:#09003e; --blue:#2282b9; --orange:#ff9c00; --bg:#f6f8fb; --line:#e3e7ef; --sub:#7a8296; }
 * { box-sizing:border-box; }
 body {margin:0; background:var(--bg); color:var(--navy);
        font-family:'맑은 고딕','Malgun Gothic','Apple SD Gothic Neo',sans-serif; -webkit-font-smoothing:antialiased;}
 .hd {background:var(--navy); color:#fff; position:relative; overflow:hidden; padding:24px 22px 22px;}
 .hd .in {max-width:440px; margin:0 auto; position:relative; z-index:1;}
 .logo {height:22px; display:block; margin-bottom:12px; filter:brightness(0) invert(1);}
 .hd h1 {margin:0; font-size:21px; letter-spacing:-.4px;}
 .hd p {margin:4px 0 0; font-size:12.5px; opacity:.75;}
 .sym {position:absolute; right:-34px; top:50%; transform:translateY(-50%) rotate(-8deg); width:170px; height:210px;
        background:center/contain no-repeat; opacity:.32;}
 .wrap {max-width:440px; margin:0 auto; padding:16px 18px 30px;}
 .tabs {display:flex; gap:4px; padding:4px; background:#fff; border:1px solid var(--line); border-radius:14px; margin-bottom:14px;}
 .tabs button {flex:1; padding:8px 4px; border:0; background:transparent; border-radius:10px; color:var(--sub);
               font-size:13.5px; font-family:inherit; cursor:pointer; line-height:1.35;}
 .tabs button.on {background:var(--blue); color:#fff;}
 .card {background:#fff; border:1px solid var(--line); border-radius:20px; padding:18px 16px 14px;}
 .card .d {font-weight:800; font-size:20px;}
 .card .p {display:inline-block; font-size:12px; color:var(--blue); background:#e6f2f9; border-radius:999px; padding:3px 11px; margin:7px 0 12px;}
 .g {display:flex; flex-direction:column; gap:4px;}
 .row {display:grid; grid-template-columns:32px 1fr; align-items:center; gap:11px; padding:8px 10px; border-radius:12px;}
 .no {width:32px; height:32px; border-radius:50%; background:var(--navy); color:#fff;
       display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;}
 .t {font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums;}
 .n {font-weight:800; font-size:17px; margin-top:1px;}
 .n span {font-weight:400; font-size:12.5px; color:var(--sub);}
 .row.now {background:#fff4e0;}
 .row.now .no {background:var(--orange);}
 .badge {display:inline-block; margin-left:6px; font-size:10.5px; font-weight:700; color:#fff; background:var(--orange);
          border-radius:999px; padding:0 7px;}
 .e {text-align:right; color:var(--sub); font-size:12.5px; margin-top:10px;}
 .msg {color:var(--sub); font-size:14px; line-height:1.6; margin-top:10px;}
 .foot {color:#aab0bf; font-size:12px; margin-top:16px; text-align:center;}
</style></head>

 <div class="foot">마지막 갱신 2026-10-13 11:07</div>
</div>
<script>
const DATA = {"2026-10-06": [{"no": 1, "time": "09:00-10:10", "name": "한순이"}, {"no": 2, "time": "10:10-11:20", "name": "조현길"}, {"no": 3, "time": "13:00-14:00", "name": "조윤화"}, {"no": 4, "time": "14:00-15:00", "name": "박종식"}, {"no": 5, "time": "15:00-16:00", "name": "황상기"}, {"no": 6, "time": "16:00-17:00", "name": "정다겸"}], "2026-10-07": [{"no": 1, "time": "09:00-10:10", "name": "박종식"}, {"no": 2, "time": "10:10-11:20", "name": "김숙자"}, {"no": 3, "time": "13:00-14:00", "name": "조현길"}, {"no": 4, "time": "14:00-15:00", "name": "황상기"}, {"no": 5, "time": "15:00-16:00", "name": "맹성수"}, {"no": 6, "time": "16:00-17:00", "name": "정다겸"}], "2026-10-08": [{"no": 1, "time": "09:00-10:10", "name": "한순이"}, {"no": 2, "time": "10:10-11:20", "name": "최문규"}, {"no": 3, "time": "13:00-14:00", "name": "김숙자"}, {"no": 4, "time": "14:00-15:00", "name": "김진훈"}, {"no": 5, "time": "15:00-16:00", "name": "조윤화"}, {"no": 6, "time": "16:00-17:00", "name": "맹성수"}], "2026-10-12": [{"no": 1, "time": "09:00-10:10", "name": "조현길"}, {"no": 2, "time": "10:10-11:20", "name": "최문규"}, {"no": 3, "time": "13:00-14:00", "name": "박종식"}, {"no": 4, "time": "14:00-15:00", "name": "황상기"}, {"no": 5, "time": "15:00-16:00", "name": "김진훈"}, {"no": 6, "time": "16:00-17:00", "name": "맹성수"}], "2026-10-13": [{"no": 1, "time": "09:00-10:10", "name": "한순이"}, {"no": 2, "time": "10:10-11:20", "name": "최문규"}, {"no": 3, "time": "13:00-14:00", "name": "맹성수"}, {"no": 4, "time": "14:00-15:00", "name": "조윤화"}, {"no": 5, "time": "15:00-16:00", "name": "박종식"}, {"no": 6, "time": "16:00-17:00", "name": "정다겸"}], "2026-10-14": [{"no": 1, "time": "09:00-10:10", "name": "한순이"}, {"no": 2, "time": "10:10-11:20", "name": "조현길"}, {"no": 3, "time": "13:00-14:00", "name": "김진훈"}, {"no": 4, "time": "14:00-15:00", "name": "박종식"}, {"no": 5, "time": "15:00-16:00", "name": "황상기"}, {"no": 6, "time": "16:00-17:00", "name": "정다겸"}]};
const PHONE = "* 대표전화 : 7141";
const SUFFIX = "선배님";
const WD = "일월화수목금토";
function kstNow() { const n = new Date(); return new Date(n.getTime() + (n.getTimezoneOffset() + 540) * 60000); }
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function label(k) { const [y,m,d] = k.split("-").map(Number); const x = new Date(y, m-1, d); return m + "/" + d + "(" + WD[x.getDay()] + ")"; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]); }
const now = kstNow(), today = iso(now), mins = now.getHours()*60 + now.getMinutes();
const keys = Object.keys(DATA).sort();
function isWork(d) { return d.getDay() !== 0 && d.getDay() !== 6; }
function stepWork(k, dir) {   // 주말 건너뛴 이전/다음 평일 (공휴일은 자료 유무로 판단)
  const [y,m,d] = k.split("-").map(Number); const x = new Date(y, m-1, d);
  do { x.setDate(x.getDate() + dir); } while (!isWork(x));
  return iso(x);
}
// 어제 = 오늘 이전 마지막 당직일, 내일 = 오늘 이후 첫 당직일 (없으면 다음 평일)
const past = keys.filter(k => k < today), fut = keys.filter(k => k > today);
const SLOTS = [
  ["어제", past.length ? past[past.length-1] : stepWork(today, -1)],
  ["오늘", today],
  ["내일", fut.length ? fut[0] : stepWork(today, 1)],
];
let cur = 1;
function card(k) {
  const items = DATA[k];
  if (!items) {
    const [y,m,d] = k.split("-").map(Number); const wk = isWork(new Date(y, m-1, d));
    const msg = k === today && !wk ? "오늘은 주말이라 당직이 없습니다."
              : k > today ? "아직 올라오지 않았습니다.<br>전날 17시 이후 게시됩니다."
              : "당직 기록이 없습니다. (휴일)";
    return '<div class="card"><div class="d">' + label(k) + '</div><div class="msg">' + msg + '</div></div>';
  }
  let h = '<div class="card"><div class="d">' + label(k) + '</div>'
        + (PHONE ? '<div class="p">' + esc(PHONE.replace(/^\*\s*/, "")) + '</div>' : '') + '<div class="g">';
  items.forEach(it => {
    const [a, b] = it.time.split("-"); const toM = s => { const [hh, mm] = s.split(":").map(Number); return hh*60+mm; };
    const on = (k === today && mins >= toM(a) && mins < toM(b));
    h += '<div class="row' + (on ? ' now' : '') + '"><div class="no">' + it.no + '</div><div>'
       + '<div class="t">' + esc(it.time.replace("-", " ~ ")) + (on ? '<span class="badge">지금</span>' : '') + '</div>'
       + '<div class="n">' + esc(it.name) + ' <span>' + esc(SUFFIX) + '</span></div></div></div>';
  });
  return h + '</div><div class="e">총 ' + items.length + '명</div></div>';
}
function render() {
  const tabs = document.getElementById("tabs"); tabs.innerHTML = "";
  SLOTS.forEach(([name, k], i) => {
    const b = document.createElement("button");
    b.innerHTML = '<b>' + name + '</b><br><span style="font-size:12px">' + label(k) + '</span>';
    if (i === cur) b.className = "on";
    b.onclick = () => { cur = i; render(); };
    tabs.appendChild(b);
  });
  document.getElementById("view").innerHTML = card(SLOTS[cur][1]);
  document.getElementById("sub").textContent = SLOTS[cur][0] + " 당직 순번";
}
render();
</script>
</body></html>
